services:
  ciao:
    image: ciao:latest
    build:
      context: .
    container_name: ciao-deploy
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ciao-cloudflared
    restart: unless-stopped
    depends_on:
      ciao:
        condition: service_healthy
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN to your Cloudflare tunnel token}
    command: tunnel --no-autoupdate run
